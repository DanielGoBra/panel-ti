<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel TI</title>
<meta name="description" content="Gestión de tareas y proyectos para equipos de TI y áreas corporativas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1b'/%3E%3Cpath d='M9 10h5v12H9zM18 10h5v7h-5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  try { const t = localStorage.getItem("pti.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="ws">
      <span class="ws-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="6" height="14" rx="1.5"/><rect x="14" y="5" width="6" height="8" rx="1.5"/></svg></span>
      <div>
        <div class="ws-name">Panel TI</div>
        <div class="ws-sub" id="ws-sub">Tecnología</div>
      </div>
    </div>
    <button class="side-search" id="open-cmdk" type="button">
      <span class="ic" data-icon="search"></span>Buscar o ir a…<kbd id="cmdk-kbd">Ctrl K</kbd>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="side-label">Proyectos <button type="button" id="side-new-project" title="Nuevo proyecto" aria-label="Nuevo proyecto"><span class="ic" data-icon="plus"></span></button></div>
    <div class="side-projects" id="side-projects"></div>
    <div class="side-foot">
      <button class="me-btn" id="me-btn" type="button" title="Cambiar de usuario"></button>
      <button class="icon-btn" id="theme-btn" type="button" title="Cambiar tema" aria-label="Cambiar tema"></button>
      <button class="icon-btn" id="help-btn" type="button" title="Atajos de teclado" aria-label="Atajos de teclado"></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Menú"><span class="ic" data-icon="menu"></span></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
